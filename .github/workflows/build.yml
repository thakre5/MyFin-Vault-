name: Build Myfin APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Ensure Static Keystore Exists
      run: |
        if [ ! -f app/debug.keystore ]; then
          echo "Keystore missing. Creating permanent keystore..."
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/debug.keystore
          git commit -m "Add permanent static debug keystore [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true
        fi
        
        # Mirror to default debug location
        mkdir -p ~/.android
        cp app/debug.keystore ~/.android/debug.keystore

    - name: Build APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Myfin-App
        path: app/build/outputs/apk/debug/app-debug.apk
