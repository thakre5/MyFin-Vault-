# ============================================================================
# AndroidX & Tooling Migration
# ============================================================================
# Enable AndroidX support (Required for Jetpack Compose & Room)
android.useAndroidX=true

# Disable Jetifier: All project dependencies are natively AndroidX.
# Disabling avoids bytecode scanning overhead during build time.
android.enableJetifier=false

# ============================================================================
# R8 / ProGuard Optimization
# ============================================================================
# Enables R8 Full Mode for deeper tree-shaking, method inlining, and smaller APK size
android.enableR8.fullMode=true

# ============================================================================
# JVM Memory & Garbage Collection
# ============================================================================
# 4GB heap provides the memory bandwidth required for R8 tree-shaking across
# Apache POI, Room schemas, and Material Icons Extended without GC thrashing.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# ============================================================================
# Build Speed & Incremental Compilation
# ============================================================================
# Run decoupled tasks in parallel across CPU cores
org.gradle.parallel=true

# Cache task outputs locally to accelerate repeated builds
org.gradle.caching=true

# Enable incremental processing for KSP (Room database code generator)
ksp.incremental=true

# Enable incremental compilation for Kotlin
kotlin.incremental=true
